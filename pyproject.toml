[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nxthooks"
dynamic = ["version"]
description = "One hook directory, five agent harnesses."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Whtnxt" }]
keywords = ["agent", "hooks", "claude-code", "codex", "opencode"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
# Standard library only. Reading a Hermes `config.yaml` uses PyYAML when it is
# importable and reports the file unreadable when it is not; nothing else
# reaches outside the standard library.
dependencies = []

[project.urls]
Source = "https://github.com/io-whtnxt/nxthooks"
Changelog = "https://github.com/io-whtnxt/nxthooks/blob/main/CHANGELOG.md"

[project.scripts]
nxthooks = "nxthooks.cli:main"

[tool.setuptools.dynamic]
version = { attr = "nxthooks.__version__" }

[tool.setuptools.packages.find]
include = ["nxthooks*"]

[tool.setuptools.package-data]
"nxthooks" = [
  "component.toml",
  "plugin.yaml",
  "nxtpack.json",
  "builtin/*.toml",
  "adapters/*.sh",
  "adapters/*.py",
  "adapters/*/*.py",
  "adapters/*/*.ts",
  "adapters/*/*.json",
  "adapters/*/*.yaml",
]
"nxthooks.engines.nxtgrep" = ["patterns/*.conf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
