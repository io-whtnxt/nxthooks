# NxtGrep builtin pattern pack — generic credential shapes only.
#
# One regex per line, case-insensitive, Python re syntax. Comments and blank
# lines are ignored. Fleet- and client-specific rules belong in the USER pack
# (~/Library/Application Support/NxtOS/nxtgrep/patterns.conf), never here:
# this file ships with NxtOS to every machine that runs it, so it must stay
# free of anything that names your clients, hosts, or engagements.
#
# Written with [.] character classes rather than escaped dots: a literal
# "192\.168" inside a pushed file is indistinguishable from the thing the
# privacy guard exists to catch, while [.] matches the same strings without
# containing them.
#
# A good seed for the user pack is ~/.config/git-privacy/patterns.txt — the
# push guard and this hook then enforce one vocabulary at two doors.

# ── Private key material ────────────────────────────────────────────────
-----BEGIN (RSA |OPENSSH |EC |DSA |PGP )?PRIVATE KEY

# ── Cloud provider credentials ──────────────────────────────────────────
AKIA[0-9A-Z]{16}
ASIA[0-9A-Z]{16}

# ── Tokens by issuer prefix ─────────────────────────────────────────────
ghp_[A-Za-z0-9]{30,}
github_pat_[A-Za-z0-9_]{20,}
xox[baprs]-[A-Za-z0-9-]{10,}
sk-(proj-)?[A-Za-z0-9_-]{20,}
glpat-[A-Za-z0-9_-]{15,}

# ── Shareable secret URLs ───────────────────────────────────────────────
hooks[.]slack[.]com/services/[A-Za-z0-9/]+
postgres(ql)?://[^/\s]+:[^@\s]+@
mysql://[^/\s]+:[^@\s]+@
mongodb(\+srv)?://[^/\s]+:[^@\s]+@
