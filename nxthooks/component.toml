entrypoint = "nxthooks"
# The version of what a host may rely on, not of this release: see contract.py.
contractVersion = "1.0"
configHome = "~/.config/nxt/hooks"
runtimeRoot = "~/.local/share/nxt/hooks"
lifecycle = ["install", "verify", "uninstall", "doctor"]
# The five harnesses NxtHooks wires. Declared so C6 seeds each one's own
# config before install and requires it back byte-identical after
# uninstall: without this key the live check has nothing to project into
# and passes on an empty machine, which is the component that projects most
# being the one least tested.
projections = ["claude-code", "codex", "pi", "opencode", "hermes"]

# What `install_runtime` copies verbatim out of the distribution, so C5 can
# hash both sides. `bin/*-dispatch.sh` and `VERSION` are deliberately absent:
# the dispatchers are templated with this machine's interpreter and roots, and
# VERSION is generated, so neither has a source to be identical to.
[artifacts]
"lib/nxthooks" = "nxthooks"
"lib/run_nxthooks.py" = "nxthooks/adapters/run_nxthooks.py"
