# NxtGrep secret scan on file-write tools; refuses a write carrying a secret.
#
# Builtin rather than library, as of 2026-09-15. It was only ever a library
# manifest, which meant NxtOS put it on this machine and a wheel put it on
# nobody's: a cold install shipped an advisory linter and no security layer at
# all, and the gap was invisible here because the library tier supplies it.
#
# before_tool and `fail = "open"`: this is the one builtin that can refuse an
# edit, so it runs before the write lands -- and a scanner that has itself
# broken must not take the agent's work down with it. A pattern that hits
# still blocks; only the scanner failing to run is forgiven.
[[hook]]
name = "secret-scan"
events = ["before_tool"]
matchers = ["Write", "Edit", "MultiEdit", "NotebookEdit"]
source = "~/.local/share/nxt/grep/bin/nxtgrep-hook.py"
provision = "nxthooks.engines.nxtgrep.install"
policy = "enforce"
fail = "open"
timeout_ms = 10000
